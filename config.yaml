litellm_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  drop_params: true

model_list:
  - model_name: gpt-4.1
    litellm_params:
      model: github_copilot/gpt-4.1
  - model_name: gpt-4o
    litellm_params:
      model: github_copilot/gpt-4o
  - model_name: gpt-5-mini
    litellm_params:
      model: github_copilot/gpt-5-mini
